<!DOCTYPE html>
<html>
<head><title>EconGrader Icon Generator</title></head>
<body>
<p>Open this file in a browser, right-click each canvas, and "Save image as" to create the icon PNGs.</p>
<div>
  <h3>16x16</h3><canvas id="c16" width="16" height="16"></canvas>
  <h3>48x48</h3><canvas id="c48" width="48" height="48"></canvas>
  <h3>128x128</h3><canvas id="c128" width="128" height="128"></canvas>
</div>
<script>
  function drawIcon(canvasId, size) {
    const c = document.getElementById(canvasId);
    const ctx = c.getContext('2d');
    const s = size;

    // Background — rounded rect
    const r = s * 0.18;
    ctx.beginPath();
    ctx.roundRect(0, 0, s, s, r);
    ctx.fillStyle = '#161B26';
    ctx.fill();

    // Document icon
    const pad = s * 0.22;
    const docW = s - pad * 2;
    const docH = s - pad * 1.6;
    const dx = pad;
    const dy = pad * 0.8;
    const fold = docW * 0.3;

    ctx.beginPath();
    ctx.moveTo(dx, dy + s * 0.05);
    ctx.lineTo(dx + docW - fold, dy);
    ctx.lineTo(dx + docW, dy + fold);
    ctx.lineTo(dx + docW, dy + docH);
    ctx.quadraticCurveTo(dx + docW, dy + docH + s * 0.02, dx + docW - s * 0.02, dy + docH + s * 0.02);
    ctx.lineTo(dx + s * 0.02, dy + docH + s * 0.02);
    ctx.quadraticCurveTo(dx, dy + docH + s * 0.02, dx, dy + docH);
    ctx.closePath();
    ctx.fillStyle = 'white';
    ctx.fill();

    // Fold triangle
    ctx.beginPath();
    ctx.moveTo(dx + docW - fold, dy);
    ctx.lineTo(dx + docW - fold, dy + fold);
    ctx.lineTo(dx + docW, dy + fold);
    ctx.closePath();
    ctx.fillStyle = '#B8CADF';
    ctx.fill();

    // Check mark
    const cx = dx + docW * 0.35;
    const cy = dy + docH * 0.55;
    const cs = docW * 0.4;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + cs * 0.35, cy + cs * 0.35);
    ctx.lineTo(cx + cs, cy - cs * 0.3);
    ctx.strokeStyle = '#3B6FAE';
    ctx.lineWidth = Math.max(1.5, s * 0.04);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  drawIcon('c16', 16);
  drawIcon('c48', 48);
  drawIcon('c128', 128);
</script>
</body>
</html>
