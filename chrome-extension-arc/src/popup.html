<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EconGrader Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px; color: #2E3545; background: #F8F9FB; padding: 16px;
      -webkit-font-smoothing: antialiased;
    }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .header svg { color: #2E3545; }
    .header h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }
    .header .badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      padding: 2px 6px; background: #ECF1F7; color: #3B6FAE; border: 1px solid #B8CADF;
      border-radius: 20px;
    }
    .header .arc-badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      padding: 2px 6px; background: #F0E6FF; color: #7B3FBF; border: 1px solid #D4B5F0;
      border-radius: 20px;
    }
    .status-card {
      background: white; border: 1px solid #DDE2EB; border-radius: 10px;
      padding: 14px; margin-bottom: 12px;
    }
    .status-row { display: flex; align-items: center; justify-content: space-between; }
    .status-label { font-size: 12px; color: #8B93A6; }
    .status-value { font-size: 12px; font-weight: 600; }
    .status-ok { color: #3A7266; }
    .status-err { color: #BF6B6B; }
    .field-label {
      display: block; font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: #8B93A6; margin-bottom: 6px;
    }
    .field {
      width: 100%; height: 36px; padding: 0 10px; background: white; border: 1px solid #DDE2EB;
      border-radius: 8px; color: #161B26; font-size: 12px; outline: none; transition: all 0.2s;
      font-family: inherit;
    }
    .field::placeholder { color: #8B93A6; }
    .field:focus { border-color: #3B6FAE; box-shadow: 0 0 0 3px rgba(59,111,174,0.1); }
    .input-section { margin-bottom: 12px; }
    .btn {
      display: flex; align-items: center; justify-content: center; width: 100%; height: 36px;
      background: #161B26; color: white; border: none; border-radius: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit;
    }
    .btn:hover { background: #2E3545; }
    .note { font-size: 11px; color: #8B93A6; margin-top: 12px; line-height: 1.5; }
    .divider { height: 1px; background: #DDE2EB; margin: 12px 0; }
    .info-card {
      background: #F0E6FF; border: 1px solid #D4B5F0; border-radius: 10px;
      padding: 12px; margin-bottom: 12px; font-size: 12px; color: #5C3D8F; line-height: 1.5;
    }
    .info-card strong { color: #4A2D7A; }
    .toast {
      position: fixed; bottom: 8px; left: 8px; right: 8px; padding: 8px 12px;
      background: #3A7266; color: white; font-size: 11px; font-weight: 600;
      border-radius: 8px; text-align: center; display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
    </svg>
    <h1>EconGrader</h1>
    <span class="badge">Docs</span>
    <span class="arc-badge">Arc</span>
  </div>

  <div class="info-card">
    <strong>How to use:</strong> Open any Google Doc, then click the <strong>"Grade"</strong> button that appears at the bottom-right of the page.
  </div>

  <div class="divider"></div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">API Status</span>
      <span id="api-status" class="status-value">Checking...</span>
    </div>
  </div>

  <div class="input-section">
    <label class="field-label">API Server URL (optional)</label>
    <input type="text" id="api-base" class="field" placeholder="https://econ-grader-pro.vercel.app">
  </div>

  <button id="save-btn" class="btn">Save Settings</button>

  <p class="note">
    The grading API runs on Vercel with a pre-configured API key.
    You only need to change the URL if you're self-hosting.
  </p>

  <div id="toast" class="toast"></div>

  <script>
    const DEFAULT_API = "https://econ-grader-pro.vercel.app";

    document.addEventListener("DOMContentLoaded", () => {
      chrome.storage.sync.get(["apiBase"], (result) => {
        if (result.apiBase) {
          document.getElementById("api-base").value = result.apiBase;
        }
      });

      checkApi();

      document.getElementById("save-btn").addEventListener("click", () => {
        const val = document.getElementById("api-base").value.trim();
        chrome.storage.sync.set({ apiBase: val || DEFAULT_API }, () => {
          showToast("Saved!");
          checkApi();
        });
      });
    });

    async function checkApi() {
      const el = document.getElementById("api-status");
      try {
        const base = document.getElementById("api-base").value.trim() || DEFAULT_API;
        const resp = await fetch(`${base}/api/health`, { method: "GET" });
        if (resp.ok) {
          el.textContent = "Connected";
          el.className = "status-value status-ok";
        } else {
          el.textContent = "Error " + resp.status;
          el.className = "status-value status-err";
        }
      } catch {
        el.textContent = "Unreachable";
        el.className = "status-value status-err";
      }
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 2000);
    }
  </script>
</body>
</html>
